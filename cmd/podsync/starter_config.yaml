# Podsync configuration.
#
# This starter file was generated by Podsync. Add at least one feed below, then restart Podsync.
# Every available option is documented in config.toml.example (in the Podsync repository, and at
# /app/config.toml.example in the Docker image); YAML uses the same keys and nesting.
# Check your changes without starting the server: podsync --check-config --config <this file>

server:
  port: 8080
  # Public URL used in feed and episode links. Set this when Podsync is behind a reverse proxy
  # or accessed from other devices, for example "http://192.168.1.10:8080".
  # hostname: http://localhost:8080

storage:
  type: local
  local:
    # Where episodes and feeds are stored. Defaults to a "data" directory next to this file
    # (/app/data in the Docker image).
    # data_dir: /app/data

# API keys. Every provider except Rumble needs an entry here (YouTube and Vimeo need a real key).
# Keys can also be set with environment variables such as PODSYNC_YOUTUBE_API_KEY.
tokens:
  # youtube: PASTE YOUR YOUTUBE API KEY HERE
  # vimeo: PASTE YOUR VIMEO API KEY HERE

# Each feed needs a unique ID; its podcast feed is served at <hostname>/<ID>.xml.
feeds:
  # my_channel:
  #   url: https://www.youtube.com/@example
  #   format: audio          # "audio" (mp3) or "video" (mp4)
  #   update_period: 12h
  #   page_size: 10          # episodes checked per update
  #   clean:
  #     keep_last: 20
  #
  # rumble_show:
  #   url: https://rumble.com/c/example
